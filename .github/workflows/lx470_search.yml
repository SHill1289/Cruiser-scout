name: LX470 database refresh

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'sources/**'
      - 'imports/**'
      - 'overrides/**'
      - 'web/**'
      - 'vercel.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'sources/**'
      - 'imports/**'
      - 'overrides/**'
      - 'web/**'
      - 'vercel.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: lx470-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare free Census map data
        run: |
          python scripts/download_location_sources.py
          python scripts/build_location_assets.py
      - run: python -m unittest discover -s tests -v

  refresh:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare free Census map data
        run: |
          python scripts/download_location_sources.py
          python scripts/build_location_assets.py
      - name: Check manual refresh cooldown
        id: manual_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/manual_refresh_gate.py
      - name: Install the photo collector
        if: steps.manual_gate.outputs.allowed == 'true'
        run: |
          python -m pip install --disable-pip-version-check selenium==4.49.0
          google-chrome --version
          chromedriver --version
      - name: Collect and update history
        if: steps.manual_gate.outputs.allowed == 'true'
        id: collect
        continue-on-error: true
        env:
          AUTODEV_API_KEY: ${{ secrets.AUTODEV_API_KEY }}
        run: python src/finder.py
      - name: Save data and source health
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ web/ sources/gazetteer/ INVENTORY.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh LX470 listings and source health'
            git push origin HEAD:main
          fi
      - name: Publish inventory summary
        if: always()
        run: cat INVENTORY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize source coverage
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('data/source_health.json')
          if not path.exists():
              summary = '### Collection status: unavailable\n\nNo source-health file was produced.\n'
          else:
              sources = json.loads(path.read_text())
              incomplete = [source for source in sources if source['status'] in {'error', 'partial'}]
              summary = ('### Collection status: partial refresh\n\nPreviously verified listings were preserved.\n'
                         if incomplete else '### Collection status: complete refresh\n')
              if incomplete:
                  summary += '\n| Incomplete source | Status | Detail |\n| --- | --- | --- |\n'
                  for source in incomplete:
                      detail = source['detail'].replace('|', '\\|').replace('\n', ' ')
                      summary += f"| {source['source']} | {source['status']} | {detail} |\n"
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('\n' + summary + '\n')
          PY
      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/source_health.json')
          if path.exists():
              for source in json.loads(path.read_text()):
                  if source['status'] in {'error', 'partial'}:
                      print(f"{source['source']} ({source['status']}): {source['detail']}")
          PY
          echo 'Partial refresh: one or more source searches were incomplete. Previously verified listings were preserved. See the source coverage summary.'
          exit 1
