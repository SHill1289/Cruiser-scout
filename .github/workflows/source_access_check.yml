name: Free source access check
on:
  push:
    branches: [source-access-check]
    paths: ['.source-check/probe.py', '.github/workflows/source_access_check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            .source-check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check selenium==4.49.0
      - run: python .source-check/probe.py
      - name: Save diagnostic report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .source-check/results
          if ! git diff --cached --quiet; then
            git commit -m "Record free source access validation"
            git push origin HEAD:source-access-check
          fi
