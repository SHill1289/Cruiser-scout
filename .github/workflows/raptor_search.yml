name: Raptor database refresh
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [raptor-finder]
    paths: ['src/**', 'sources/config.json', 'tests/**', 'imports/**', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'sources/config.json', 'imports/**']
permissions:
  contents: read
concurrency:
  group: raptor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
  refresh:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/raptor-finder'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect listings
        id: collect
        continue-on-error: true
        run: python src/finder.py
      - name: Save inventory and source status
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ web/inventory.json web/photos/ INVENTORY.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Raptor listings and source health'
            git push origin HEAD:raptor-finder
          fi
      - name: Publish summary
        if: always()
        run: cat INVENTORY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report incomplete coverage
        if: steps.collect.outcome == 'failure'
        run: exit 1
